name: Materialize Qwen vLLM integration

on:
  push:
    branches:
      - agent/qwen-vllm-compat

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[materialized-qwen-vllm]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/qwen-vllm-compat

      - name: Apply source integration
        run: node scripts/apply-qwen-vllm-compat.mjs .

      - name: Commit generated source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/types.ts src/adapters/openai-chat.ts
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "feat: integrate Qwen vLLM compatibility [materialized-qwen-vllm]"
          git push origin HEAD:agent/qwen-vllm-compat
