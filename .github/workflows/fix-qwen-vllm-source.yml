name: Fix Qwen vLLM committed source

on:
  push:
    branches:
      - agent/qwen-vllm-compat

permissions:
  contents: write

jobs:
  fix-source:
    if: ${{ !contains(github.event.head_commit.message, '[fixed-qwen-vllm-source]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/qwen-vllm-compat

      - name: Apply committed-source type fix
        run: node scripts/fix-qwen-vllm-reasoning-log.mjs src/adapters/openai-chat.ts

      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/adapters/openai-chat.ts
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "fix: keep Qwen vLLM reasoning log type-safe [fixed-qwen-vllm-source]"
          git push origin HEAD:agent/qwen-vllm-compat
